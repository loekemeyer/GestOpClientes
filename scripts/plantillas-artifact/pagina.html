<title>Plantillas de WhatsApp Loekemeyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: una sola columna, letra grande, una idea por bloque. Sin gráficos: números grandes y frases cortas. */
:root {
  --bg: #f1f3f1; --surface: #ffffff; --ink: #14201b; --muted: #4f5d56; --line: #cfd8d3;
  --accent: #0d6b57; --accent-soft: #dcefe8;
  --wall: #e7e1d6; --bubble: #ffffff; --bubble-ink: #111b21; --bubble-meta: #667781;
  --ok: #17663f; --ok-bg: #d8f0e0; --warn: #7a4a00; --warn-bg: #fbe7c4; --bad: #9d2530; --bad-bg: #f8dfe1;
  --grey: #4f5d56; --grey-bg: #e4e8e5;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #171e1b; --ink: #eef3ef; --muted: #a8b5ad; --line: #2c3833;
  --accent: #6fd0b1; --accent-soft: #173229;
  --wall: #0b141a; --bubble: #202c33; --bubble-ink: #e9edef; --bubble-meta: #8696a0;
  --ok: #86dba8; --ok-bg: #173323; --warn: #f3c56e; --warn-bg: #3a2c12; --bad: #f4979f; --bad-bg: #3b1c20;
  --grey: #b0bab4; --grey-bg: #252d2a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171e1b; --ink: #eef3ef; --muted: #a8b5ad; --line: #2c3833;
  --accent: #6fd0b1; --accent-soft: #173229;
  --wall: #0b141a; --bubble: #202c33; --bubble-ink: #e9edef; --bubble-meta: #8696a0;
  --ok: #86dba8; --ok-bg: #173323; --warn: #f3c56e; --warn-bg: #3a2c12; --bad: #f4979f; --bad-bg: #3b1c20;
  --grey: #b0bab4; --grey-bg: #252d2a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 19px; line-height: 1.4; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; gap: 22px; }
h1 { font-size: 36px; line-height: 1.1; margin: 0; font-weight: 800; text-wrap: balance; }
h2 { font-size: 26px; margin: 0; font-weight: 800; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 21px; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.llave { border-radius: 16px; padding: 16px 20px; display: flex; gap: 16px; align-items: center; font-weight: 700; font-size: 21px; }
.llave .luz { width: 26px; height: 26px; border-radius: 50%; flex: none; background: currentColor; }
.llave small { display: block; font-weight: 400; font-size: 18px; color: var(--ink); }
.ll-0 { background: var(--bad-bg); color: var(--bad); } .ll-prueba { background: var(--warn-bg); color: var(--warn); } .ll-1 { background: var(--ok-bg); color: var(--ok); }

.tabs { display: flex; gap: 8px; }
.tab { flex: 1; font-weight: 800; font-size: 20px; background: var(--grey-bg); border: 0; color: var(--muted); padding: 14px 8px; cursor: pointer; border-radius: 12px; }
.tab[aria-selected="true"] { background: var(--accent); color: #fff; }
.vista { display: flex; flex-direction: column; gap: 14px; }
.vista[hidden] { display: none; }
.ayuda { margin: 0; color: var(--muted); font-size: 19px; }

/* Problemas */
.problema { width: 100%; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; cursor: pointer; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.problema:hover { border-color: var(--accent); }
.problema .n { grid-row: span 2; text-align: center; line-height: 1; }
.problema .n b { font-size: 36px; font-weight: 800; display: block; font-variant-numeric: tabular-nums; }
.problema .n small { font-size: 14px; color: var(--muted); }
.problema h3 { margin: 0; font-size: 23px; line-height: 1.2; }
.arregla { font-size: 20px; }
.arregla::before { content: "→ "; color: var(--accent); font-weight: 800; }
.sello { margin-top: 6px; font-size: 16px; font-weight: 800; border-radius: 999px; padding: 3px 12px; justify-self: start; }
.hecho { color: var(--ok); background: var(--ok-bg); } .parcial { color: var(--warn); background: var(--warn-bg); } .pendiente { color: var(--bad); background: var(--bad-bg); }
.problema .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Mensajes */
.grupo h2 { margin-bottom: 12px; }
.lista { display: flex; flex-direction: column; gap: 16px; }
.msj { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.msj-cab { padding: 14px 18px 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.msj-cab b { font-size: 21px; }
.msj-cab span { font-size: 17px; color: var(--muted); }
.msj .cuando { padding: 12px 18px 16px; font-size: 20px; margin: 0; }
.msj .cuando small { display: block; font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.noenvia { color: var(--bad); font-weight: 700; }
details.otros > summary { cursor: pointer; font-weight: 800; font-size: 21px; color: var(--accent); padding: 8px 0; }

/* Burbuja de WhatsApp */
.chat { background: var(--wall); padding: 16px 18px 16px 16px; display: flex; align-items: flex-start; min-width: 0; }
.burbuja { background: var(--bubble); color: var(--bubble-ink); border-radius: 0 12px 12px 12px; padding: 10px 12px 6px; max-width: 100%; box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); position: relative; font-size: 18px; line-height: 1.4; min-width: 0; }
.burbuja::before { content: ""; position: absolute; left: -7px; top: 0; border-top: 0 solid transparent; border-right: 8px solid var(--bubble); border-bottom: 10px solid transparent; }
.burbuja .doc { display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--bubble-meta) 14%, transparent); border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 16px; }
.burbuja .doc i { font-style: normal; font-weight: 700; font-size: 11px; color: #fff; background: #d9534f; border-radius: 3px; padding: 2px 4px; }
.burbuja .head { font-weight: 700; margin-bottom: 4px; }
.burbuja .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.burbuja .var { background: color-mix(in srgb, var(--accent) 20%, transparent); border-radius: 3px; padding: 0 2px; }
.burbuja .pie { color: var(--bubble-meta); font-size: 15px; margin-top: 4px; }
.burbuja .hora { color: var(--bubble-meta); font-size: 13px; text-align: right; margin-top: 2px; }
.botones { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; border-top: 1px solid color-mix(in srgb, var(--bubble-meta) 25%, transparent); }
.botones span { text-align: center; color: #1a8fd6; font-size: 17px; padding: 6px 0 2px; }

/* Números */
.dato { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.dato b { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.dato span { font-size: 21px; }
.dato.g b { color: var(--ok); } .dato.a b { color: var(--warn); } .dato.r b { color: var(--bad); }
.par { display: flex; flex-direction: column; gap: 8px; }

/* Popup */
.modal-fondo { position: fixed; inset: 0; z-index: 30; background: rgba(8, 14, 12, 0.65); display: flex; padding: 14px; overflow-y: auto; }
.modal { background: var(--bg); color: var(--ink); border-radius: 18px; width: 100%; max-width: 640px; margin: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); }
.modal-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-cab h2 { font-size: 24px; }
.modal-cerrar { font-size: 19px; font-weight: 800; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 10px 20px; cursor: pointer; }
.modal h4 { margin: 0 0 4px; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.modal p { margin: 0; font-size: 20px; }
.modal .bloque { display: flex; flex-direction: column; gap: 10px; }
.modal .msj { border-radius: 14px; }
.falta { font-size: 19px; padding: 12px 14px; background: var(--warn-bg); border-radius: 12px; }
.falta b { color: var(--warn); }

@media (max-width: 560px) {
  h1 { font-size: 30px; }
  .tab { font-size: 17px; padding: 12px 4px; }
  .problema { grid-template-columns: 64px minmax(0, 1fr); }
  .problema .n b { font-size: 30px; }
  .dato b { font-size: 38px; }
}
</style>

<div class="wrap">
  <header>
    <h1>Plantillas de WhatsApp</h1>
    <p class="sub">Qué problema arregla cada mensaje automático.</p>
  </header>

  <div class="llave" id="llave"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-problemas" aria-selected="true" aria-controls="v-problemas" type="button">Problemas</button>
    <button class="tab" role="tab" id="tab-mensajes" aria-selected="false" aria-controls="v-mensajes" type="button">Mensajes</button>
    <button class="tab" role="tab" id="tab-numeros" aria-selected="false" aria-controls="v-numeros" type="button">Números</button>
  </div>

  <div class="vista" id="v-problemas" role="tabpanel" aria-labelledby="tab-problemas"></div>
  <div class="vista" id="v-mensajes" role="tabpanel" aria-labelledby="tab-mensajes" hidden></div>
  <div class="vista" id="v-numeros" role="tabpanel" aria-labelledby="tab-numeros" hidden></div>
</div>

<script>
const DATOS = /*__DATOS__*/null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n, d = 0) => Number(n).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => (b ? nf((100 * a) / b, 0) + " %" : "—");
const fdm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const FACTURAS = ["pedido_contado_s", "pedido_contado_p", "pedido_credito_s", "pedido_credito_p", "pedido_echeq_s", "pedido_echeq_p"];
const EST = { hecho: "Resuelto", parcial: "En parte", pendiente: "Pendiente" };

function cuerpo(body, ej) {
  const h = esc(body).replace(/\{\{(\d+)\}\}/g, (m, n) => `<span class="var">${esc((ej || [])[n - 1] ?? m)}</span>`);
  return h.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
}
function burbuja(p) {
  const doc = p.header === "DOCUMENT" ? `<div class="doc"><i>PDF</i> Factura.pdf</div>` : "";
  const head = p.header === "TEXT" && p.header_text ? `<div class="head">${esc(p.header_text)}</div>` : "";
  const pie = p.footer ? `<div class="pie">${esc(p.footer)}</div>` : "";
  const bots = (p.buttons || []).length ? `<div class="botones">${p.buttons.map((b) => `<span>${esc(b)}</span>`).join("")}</div>` : "";
  return `<div class="chat"><div class="burbuja">${doc}${head}<div class="txt">${cuerpo(p.body, p.ejemplos)}</div>${pie}<div class="hora">10:24</div>${bots}</div></div>`;
}
const veces = (name) => {
  const n = DATOS.simulacion?.uso_2m?.[name];
  return n === undefined || n === null ? "" : `<span>${nf(n)} ${n === 1 ? "vez" : "veces"} en 2 meses</span>`;
};
// Tarjeta de un mensaje: el mensaje tal como llega y una frase de cuándo sale.
function tarjeta(p) {
  const apagado = p.estado === "sin_disparador" ? `<span class="noenvia">Todavía no se manda</span>` : "";
  return `<article class="msj"><div class="msj-cab"><b>${esc(p.para || p.name)}</b>${veces(p.name) || apagado}</div>${burbuja(p)}
    <p class="cuando"><small>Sale cuando</small>${esc(p.sale)}</p></article>`;
}

function llave() {
  const L = {
    "0": ["ll-0", "Envíos apagados", "No sale ningún mensaje."],
    prueba: ["ll-prueba", "Envíos en prueba", "Los clientes todavía no reciben nada."],
    "1": ["ll-1", "Envíos activos", "Los mensajes les llegan a los clientes."],
  }[DATOS.llave] || ["ll-prueba", "Estado desconocido", ""];
  const el = document.getElementById("llave");
  el.className = "llave " + L[0];
  el.innerHTML = `<span class="luz"></span><div>${L[1]}<small>${L[2]}</small></div>`;
}

// ── Problemas: cada causa con su arreglo en una línea. Tocarla abre el mensaje. ──
function problemas() {
  const S = DATOS.soluciones, v = document.getElementById("v-problemas");
  if (!S) { v.innerHTML = ""; return; }
  v.innerHTML = `<h2>Por qué nos escriben los clientes</h2>
    <p class="ayuda">${nf(S.total_consultas)} consultas en 2 meses. Tocá una para ver cómo se arregla.</p>` +
    S.motivos.map((m, i) => `<button class="problema" type="button" data-i="${i}">
      <div class="n"><b>${nf(m.consultas)}</b><small>${pct(m.consultas, S.total_consultas)}</small></div>
      <h3>${esc(m.motivo)}</h3>
      <div class="meta"><span class="arregla">${esc(m.resumen || "")}</span><span class="sello ${esc(m.estado)}">${EST[m.estado] || m.estado}</span></div>
    </button>`).join("");
  v.querySelectorAll(".problema").forEach((b) => b.addEventListener("click", () => abrirProblema(S.motivos[Number(b.dataset.i)], b)));
}

function abrirProblema(m, origen) {
  const nombres = [...new Set((m.previene || []).flatMap((p) => p.tpl === "pedido_contado_s" ? FACTURAS : [p.tpl]))];
  const lista = nombres.map((n) => DATOS.plantillas.find((x) => x.name === n)).filter(Boolean);
  const cuerpoMod = `
    <div class="bloque"><h4>Cómo se arregla</h4><p>${esc(m.resumen || "")}</p></div>
    ${lista.length ? `<div class="bloque"><h4>${lista.length > 1 ? "Los mensajes que le llegan" : "El mensaje que le llega"}</h4>${lista.map(tarjeta).join("")}</div>`
      : `<div class="bloque"><h4>Qué contesta el bot</h4><p>${esc(m.bot)}</p></div>`}
    ${m.deriva ? `<div class="bloque"><h4>Cuándo lo ve una persona</h4><p>${esc(m.deriva)}</p></div>` : ""}
    ${m.falta ? `<div class="falta"><b>Falta:</b> ${esc(m.falta)}</div>` : ""}`;
  modal(m.motivo, cuerpoMod, origen);
}

function modal(titulo, html, origen) {
  document.querySelector(".modal-fondo")?.remove();
  const fondo = document.createElement("div");
  fondo.className = "modal-fondo";
  fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="modal-cab"><h2>${esc(titulo)}</h2><button class="modal-cerrar" type="button">Cerrar</button></div>${html}</div>`;
  const cerrar = () => { fondo.remove(); document.removeEventListener("keydown", tecla); document.body.style.overflow = ""; origen?.focus(); };
  const tecla = (e) => { if (e.key === "Escape") cerrar(); };
  fondo.addEventListener("click", (e) => { if (e.target === fondo) cerrar(); });
  fondo.querySelector(".modal-cerrar").addEventListener("click", cerrar);
  document.addEventListener("keydown", tecla);
  document.body.style.overflow = "hidden";
  document.body.appendChild(fondo);
  fondo.querySelector(".modal-cerrar").focus();
}

// ── Mensajes: los que se mandan, por etapa. Lo viejo y lo de otros sistemas queda plegado. ──
function mensajes() {
  const v = document.getElementById("v-mensajes");
  const activos = DATOS.grupos.filter((g) => !["legado", "otros"].includes(g.id));
  const bloque = (g) => {
    const items = DATOS.plantillas.filter((p) => p.grupo === g.id).sort((a, b) => a.orden - b.orden);
    return items.length ? `<section class="grupo"><h2>${esc(g.titulo)}</h2><p class="ayuda" style="margin-bottom:12px">${esc(g.bajada)}</p><div class="lista">${items.map(tarjeta).join("")}</div></section>` : "";
  };
  const resto = DATOS.plantillas.filter((p) => ["legado", "otros"].includes(p.grupo));
  v.innerHTML = activos.map(bloque).join("") +
    (resto.length ? `<details class="otros"><summary>Ver los ${resto.length} que ya no se usan o son de otros sistemas</summary><div class="lista" style="margin-top:12px">${resto.map(tarjeta).join("")}</div></details>` : "");
}

// ── Números: lo justo, en grande. ──
function numeros() {
  const S = DATOS.simulacion, v = document.getElementById("v-numeros");
  if (!S) { v.innerHTML = `<p class="ayuda">Todavía no hay datos.</p>`; return; }
  const T = S.avisos.reduce((t, a) => ({ ag: t.ag + a.agendado, erp: t.erp + a.erp, sin: t.sin + a.sin }), { ag: 0, erp: 0, sin: 0 });
  const total = T.ag + T.erp + T.sin, llegan = T.ag + T.erp, costo = llegan * S.tarifa_utility;
  const D = S.demora, modos = D.por_modo.filter((m) => m.modo !== "Total");
  v.innerHTML = `<h2>Si los avisos hubieran estado prendidos</h2>
    <p class="ayuda">Del ${fdm(S.desde)} al ${fdm(S.hasta)}, con pedidos reales.</p>
    <div class="par">
      <div class="dato"><b>${nf(total)}</b><span>avisos se habrían mandado</span></div>
      <div class="dato g"><b>${nf(T.ag)}</b><span>le llegarían hoy a ${pct(T.ag, total)}</span></div>
      <div class="dato a"><b>${nf(T.erp)}</b><span>le llegarían si agendamos el teléfono</span></div>
      <div class="dato r"><b>${nf(T.sin)}</b><span>no llegarían: no tienen teléfono</span></div>
      <div class="dato"><b>US$ ${nf(costo, 0)}</b><span>costaría en los 2 meses</span></div>
    </div>
    <h2 style="margin-top:12px">Cuánto tarda un pedido en salir</h2>
    <div class="par">${modos.map((m) => `<div class="dato"><b>${nf(m.mediana)} días</b><span>${esc(m.modo)}: la mitad sale antes</span></div>`).join("")}</div>`;
}

function pestanas() {
  const tabs = ["problemas", "mensajes", "numeros"];
  const ir = (id) => tabs.forEach((k) => {
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === id));
    document.getElementById("v-" + k).hidden = k !== id;
  });
  tabs.forEach((k) => document.getElementById("tab-" + k).addEventListener("click", () => { ir(k); try { history.replaceState(null, "", "#" + k); } catch {} }));
  const h = location.hash.slice(1);
  if (tabs.includes(h)) ir(h);
}

if (DATOS) { llave(); problemas(); mensajes(); numeros(); pestanas(); }
else document.getElementById("v-problemas").innerHTML = `<p class="ayuda">Esta página se arma con generar.mjs: todavía no tiene datos.</p>`;
</script>
