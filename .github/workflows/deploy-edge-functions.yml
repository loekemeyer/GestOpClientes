name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:  # permite disparo manual desde la UI de Actions
    inputs:
      funciones:
        description: "Funciones a desplegar separadas por espacio, o 'todas'. Vacío = las que cambiaron desde el último push que salió verde (lo que un push rojo dejó sin desplegar)."
        required: false
        default: ""

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false  # cola: no cancelar deploys en curso

jobs:
  # Pablo, 08/10/2026: las pruebas de tests/ corren ANTES de deployar y, si falla una, no se deploya
  # nada. Hasta acá el CI deployaba sin correrlas (69 archivos, 2.184 chequeos al 08/10): una regla del
  # bot rota llegaba al webhook y se veía recién en el Simulador o en una charla real.
  # Job aparte y sin secretos: las pruebas no necesitan el token de Supabase y no lo ven.
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Algunas pruebas se escribieron para node (`--experimental-strip-types`, desde node 22.6).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correr las pruebas (sin red, sin IA, US$ 0)
        run: ./tests/correr-todas.sh

  deploy:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read      # para que setup-cli consulte releases autenticado
      actions: read       # para buscar el último push que salió verde (base del diff, problema 813)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: kwkclwhmoygunqmlegrg
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el diff se hace contra el último push que salió verde (o, si no se lo
          # encuentra, contra el commit que había ANTES del push: github.event.before), no contra HEAD^.
          # Con HEAD^ un push de varios commits sólo miraba el último: el 24/09 un cambio en
          # _shared/faq.ts no se desplegó porque el commit de arriba era de docs ("Sin cambios").
          fetch-depth: 0

      # Versión FIJA del CLI (Pablo, 13/10/2026). Con `version: latest`, setup-cli le pregunta a la API de GitHub
      # cuál es el último release y, si esa API está limitada (60 req/h por IP compartida entre runners), el job
      # muere antes de desplegar nada: "Failed to resolve latest Supabase CLI release: rate limit exceeded".
      # Pasó el 2026-09-09 y otra vez el 13/10 a las 17:37 UTC (corrida 379, un commit sólo de comentarios).
      # El 09/09 se probó autenticar la consulta con `GITHUB_TOKEN` para no congelar la versión, y el 13/10
      # falló IGUAL con el token puesto. Con una versión exacta setup-cli no tiene que resolver `latest`.
      #
      # 2.120.0 = el último de npm el 13/10 (publicado el 06/10), o sea el que `latest` resolvió en la corrida buena de las
      # 16:10 UTC (el log de setup-cli no imprime la versión: dato de npm, no del log). Para subirla: cambiar
      # el número, mirar que el primer deploy salga bien y que `supabase functions deploy` siga usando el mismo
      # edge-runtime (hoy v1.77.4 en el log). No poner `latest` de nuevo.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Descubre qué funciones cambiaron. Si cambió algo en `_shared/`, se
      # despliegan TODAS las funciones que lo importan (el grep de abajo las
      # detecta solo). El resto solo se despliega si su propio directorio
      # cambió.
      - name: Detectar funciones a desplegar
        id: detect
        env:
          MANUAL: ${{ github.event.inputs.funciones }}
          EVENT_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Todas las funciones bajo supabase/functions/ (menos _shared)
          ALL_FNS=$(ls supabase/functions | grep -v '^_shared$' || true)

          # Disparo manual con lista explícita
          if [ -n "$MANUAL" ]; then
            if [ "$MANUAL" = "todas" ]; then MANUAL="$ALL_FNS"; fi
            FNS=$(echo $MANUAL | xargs)
            echo "functions=$FNS" >> "$GITHUB_OUTPUT"
            echo "Manual: $FNS"
            exit 0
          fi

          # Base del diff = lo último que se sabe desplegado. Problema 813 (15/10/2026): la base era sólo
          # github.event.before (el main anterior a ESTE push). Si ese push anterior había salido rojo
          # (pruebas caídas, deploy sin correr) y éste no tocaba funciones, el diff daba vacío, el deploy
          # se salteaba y el CI terminaba verde con producción desactualizada: el fix de f03f3b4 estuvo
          # 8 minutos sin desplegar así (corridas 464 y 465). Un push verde despliega todo lo que cambió
          # desde su propia base, así que por inducción todo lo anterior a su commit está desplegado: la
          # base es el commit del último push verde. Los disparos manuales no cuentan: pueden desplegar
          # sólo algunas funciones.
          NULL_SHA="0000000000000000000000000000000000000000"
          OK_SHA=$(gh api "repos/${REPO}/actions/workflows/deploy-edge-functions.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -n "$OK_SHA" ] && { ! git cat-file -e "$OK_SHA^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$OK_SHA" HEAD; }; then
            echo "Se ignora el último push verde ($OK_SHA): no está en la historia de HEAD."
            OK_SHA=""
          fi
          BEFORE=""
          if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "$NULL_SHA" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$EVENT_BEFORE"
          fi

          # Si hay dos candidatas gana la más vieja: desplegar de más es inofensivo, de menos no.
          if [ -n "$OK_SHA" ] && [ -n "$BEFORE" ]; then
            if git merge-base --is-ancestor "$OK_SHA" "$BEFORE"; then BASE="$OK_SHA"; else BASE="$BEFORE"; fi
          elif [ -n "$OK_SHA" ]; then
            BASE="$OK_SHA"
          elif [ -n "$BEFORE" ]; then
            BASE="$BEFORE"
          else
            BASE="HEAD^"
          fi
          echo "Base del diff: $BASE (último push verde: ${OK_SHA:-ninguno}, antes del push: ${BEFORE:-ninguno})"
          # Sólo se avisa si entre el último verde y el commit anterior al push hubo cambios en funciones: una base más
          # vieja por un push de docs (que no dispara el workflow) no deja nada pendiente.
          if [ -n "$BEFORE" ] && [ "$BASE" != "$BEFORE" ] && [ -n "$(git diff --name-only "$BASE" "$BEFORE" -- supabase/functions/)" ]; then
            echo "Aviso: había funciones sin desplegar de un push anterior que no salió verde: se despliegan ahora."
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ || true)

          # ¿Cambió shared?
          SHARED_CHANGED=$(echo "$CHANGED" | grep -E '^supabase/functions/_shared/' || true)

          FNS_TO_DEPLOY=""
          for fn in $ALL_FNS; do
            OWN_CHANGE=$(echo "$CHANGED" | grep -E "^supabase/functions/${fn}/" || true)
            if [ -n "$OWN_CHANGE" ]; then
              FNS_TO_DEPLOY="$FNS_TO_DEPLOY $fn"
              continue
            fi
            # Si cambió shared, solo redeploy si la función lo importa. Cuenta también el import de
            # efecto (`import "../_shared/wa-guard.ts";`, sin `from`): el 02/10 cinco funciones
            # (asoc-timeout-cron, inbox-api, inbox-register, notify-order-created,
            # notify-tracking-status) importaban wa-guard SÓLO así y un cambio en el corte de
            # envíos a Meta no las habría redeployado.
            if [ -n "$SHARED_CHANGED" ] && grep -rq "\"\.\./_shared/" "supabase/functions/${fn}/"; then
              FNS_TO_DEPLOY="$FNS_TO_DEPLOY $fn"
            fi
          done

          FNS_TO_DEPLOY=$(echo "$FNS_TO_DEPLOY" | xargs || true)
          echo "functions=$FNS_TO_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Cambiadas: $FNS_TO_DEPLOY"

      - name: Deploy
        if: steps.detect.outputs.functions != ''
        run: |
          set -e
          for fn in ${{ steps.detect.outputs.functions }}; do
            echo "── Deploy $fn ──"
            # verify_jwt=false: el proyecto trabaja con webhooks/RPCs propios,
            # no con auth de usuario final. Cada función que necesite JWT lo
            # setea internamente por config del dashboard.
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          done

      - name: Sin cambios
        if: steps.detect.outputs.functions == ''
        run: echo "No hay funciones para deployar."
