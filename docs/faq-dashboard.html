<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FAQs - Loekemeyer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #0066cc;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .filter-label {
            font-size: 12px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
        }

        .filter-btn:hover {
            border-color: #0066cc;
        }

        .filter-btn.type-auto { border-color: #4caf50; }
        .filter-btn.type-auto.active { background: #4caf50; border-color: #4caf50; }

        .filter-btn.type-semi { border-color: #ff9800; }
        .filter-btn.type-semi.active { background: #ff9800; border-color: #ff9800; }

        .filter-btn.type-human { border-color: #f44336; }
        .filter-btn.type-human.active { background: #f44336; border-color: #f44336; color: white; }

        .faq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .faq-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            border-left: 5px solid #0066cc;
            position: relative;
        }

        .faq-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .faq-card.type-auto { border-left-color: #4caf50; }
        .faq-card.type-semi { border-left-color: #ff9800; }
        .faq-card.type-human { border-left-color: #f44336; }

        .faq-card.updated {
            background: #f0f8f5;
        }

        .faq-card.hidden {
            opacity: 0.5;
            background: #f5f5f5;
        }

        .faq-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .faq-number {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .faq-card.type-auto .faq-number { background: #4caf50; }
        .faq-card.type-semi .faq-number { background: #ff9800; }
        .faq-card.type-human .faq-number { background: #f44336; }

        .faq-status-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 5px;
        }

        .faq-status-badge.inactive {
            background: #999;
        }

        .faq-category {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            margin-top: 8px;
            font-family: monospace;
        }

        .faq-question {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .faq-response {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
            border-left: 3px solid #ddd;
            margin-bottom: 12px;
        }

        .faq-flow {
            background: #e3f2fd;
            border-left: 3px solid #0066cc;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #1565c0;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .faq-flow.type-auto { background: #c8e6c9; border-left-color: #4caf50; color: #2e7d32; }
        .faq-flow.type-semi { background: #fff3cd; border-left-color: #ff9800; color: #856404; }
        .faq-flow.type-human { background: #f8bbd0; border-left-color: #f44336; color: #c2185b; }

        .faq-flow-title {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .faq-flow-detail {
            font-size: 11px;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-style: italic;
        }

        .faq-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-auto {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .badge-semi {
            background: #fff3cd;
            color: #856404;
        }

        .badge-human {
            background: #f8bbd0;
            color: #c2185b;
        }

        .stats {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Dashboard FAQs Loekemeyer</h1>
            <p>Listado completo — Supabase PaginaLK | Categoría • Flujo • Pregunta • Respuesta</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">39</div>
                <div class="stat-label">Total Activas</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">8</div>
                <div class="stat-label">✅ Actualizadas</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" style="color: #4caf50;">18</div>
                <div class="stat-label">AUTO</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" style="color: #ff9800;">15</div>
                <div class="stat-label">SEMI-AUTO</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" style="color: #f44336;">4</div>
                <div class="stat-label">HUMANO</div>
            </div>
        </div>

        <div class="filter-section">
            <span class="filter-label">🎯 Filtrar por estado:</span>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filterFAQs('status', 'all')">Todas</button>
                <button class="filter-btn" onclick="filterFAQs('status', 'updated')">✅ Actualizadas</button>
            </div>

            <span class="filter-label" style="margin-top: 15px;">⚙️ Filtrar por tipo de flujo:</span>
            <div class="filter-bar">
                <button class="filter-btn type-auto active" onclick="filterFAQs('type', 'all')">Todos</button>
                <button class="filter-btn type-auto" onclick="filterFAQs('type', 'auto')">✅ AUTO — Respuesta directa</button>
                <button class="filter-btn type-semi" onclick="filterFAQs('type', 'semi')">🔄 SEMI-AUTO — Busca datos</button>
                <button class="filter-btn type-human" onclick="filterFAQs('type', 'human')">👤 HUMANO — Escala a vendedor</button>
            </div>
        </div>

        <div class="faq-grid" id="faqGrid">
            <!-- FAQs insertadas aquí -->
        </div>
    </div>

    <script>
        const flows = {
            auto: "✅ Bot responde solo, plantilla fija. Sin DB, sin humano.",
            semi_order: "🔄 Bot busca en BD: orders → order_status → [fecha_programada]. Completa respuesta.",
            semi_customer: "🔄 Bot busca en BD: customers → [descuento_volumen / categoría]. Completa respuesta.",
            semi_product: "🔄 Bot busca en BD: products → [precio, stock, código]. Informa disponibilidad.",
            semi_vendor: "🔄 Bot busca en BD: customer_vendors → [nombre, contacto]. Conecta con vendedor.",
            human: "👤 Bot recolecta info y escala a vendedor para aprobación/acción."
        };

        const faqs = [
            {id: 1, type: "semi", flow: "semi_order", category: "transporte_fecha_entrega", label: "Transporte", question: "¿Cuándo llega mi pedido?", response: "Estoy consultando el estado de tu pedido. Tu pedido está programado para el día [fecha]. Tené en cuenta que la fecha de salida de nuestro centro de distribución es aproximada y puede variar 2 o 3 días.", updated: false, active: true},
            {id: 2, type: "semi", flow: "semi_product", category: "hacer_modificar_pedido", label: "Hacer pedido", question: "Quiero hacer un pedido", response: "Podés hacer tu pedido de 2 formas:\n1️⃣ *Página Web*: Ingresá a loekemeyer.com\n2️⃣ *Por acá*: Decime los códigos y cantidades", updated: false, active: true},
            {id: 3, type: "human", flow: "human", category: "hacer_modificar_pedido", label: "Modificar pedido", question: "Necesito modificar mi pedido", response: "Tomo nota de la modificación. Voy a verificar el estado de tu pedido para confirmar si se puede modificar. Un vendedor te va a contactar.", updated: false, active: true},
            {id: 4, type: "semi", flow: "semi_order", category: "retiro_deposito", label: "Dirección/horario", question: "Confirmar fecha de retiro", response: "Nuestro depósito se encuentra ubicado en:\n📫 Dirección: Virgilio 2788, Villa Devoto, CABA\n🕐 Horario: Lunes a Viernes de 10 a 12hs y 13 a 16hs\nTu pedido está programado para: [fecha_programada]", updated: true, active: true},
            {id: 5, type: "semi", flow: "semi_order", category: "retiro_deposito", label: "Fecha retiro", question: "¿Para cuándo puedo programar retiro?", response: "Tu pedido está en programación. ¿Para qué fecha podés pasar a retirarlo? Recordá que el horario es de 10 a 12 hs y de 13 a 16 hs.", updated: false, active: true},
            {id: 6, type: "semi", flow: "semi_customer", category: "web_registro", label: "Alta cliente", question: "Quiero darme de alta", response: "Para darte de alta como cliente necesitamos:\n📋 Razón social • 👤 Contacto • 📱 Teléfono • 🔢 CUIT • 📧 Mail • 📍 Dirección", updated: false, active: true},
            {id: 7, type: "semi", flow: "semi_customer", category: "web_registro", label: "Acceso web", question: "Formas de pago / CBU", response: "[DESACTIVADO - Unificado en FAQ #15]", updated: false, active: false},
            {id: 8, type: "semi", flow: "semi_customer", category: "descuentos", label: "Descuentos", question: "¿Qué descuento tengo?", response: "Tus descuentos:\n📦 Por volumen • 💻 Por web: 2% • 💰 Por pago (25%-5% según plazo)", updated: false, active: true},
            {id: 9, type: "semi", flow: "semi_order", category: "estado_pedido", label: "Estado pedido", question: "¿En qué estado está mi pedido?", response: "Estoy consultando el estado de tu pedido. [estado]. Programado para [fecha].", updated: false, active: true},
            {id: 10, type: "auto", flow: "auto", category: "facturacion", label: "Facturación", question: "No llegó factura", response: "La factura se envía por mail el día que sale tu pedido (revisá la carpeta de spam). La mercadería viaja solo con remito.\n\nSi no te llegó, pasame tu CUIT o N° de pedido y la reenviamos. 📧", updated: true, active: true},
            {id: 11, type: "auto", flow: "auto", category: "precios_lista", label: "Lista de precios", question: "¿Me pasás la lista de precios?", response: "Estimados clientes,\n\nA través de Loekemeyer.com podrán ver la lista de precios, catalogo, gestionar su reposición...", updated: true, active: true},
            {id: 12, type: "semi", flow: "semi_product", category: "precios_lista", label: "Precio artículo", question: "¿Cuánto sale el artículo?", response: "Estoy consultando el precio del artículo que me pedís.", updated: false, active: true},
            {id: 13, type: "auto", flow: "auto", category: "precios_lista", label: "Aumento precios", question: "¿Hubo aumento?", response: "La lista vigente es la que está en la web. No hay aviso de aumento. loekemeyer.com", updated: false, active: true},
            {id: 14, type: "semi", flow: "semi_product", category: "stock", label: "Stock", question: "¿Tienen stock?", response: "El stock lo podés ver en loekemeyer.com. Si necesitás confirmar artículo, decime el código.", updated: false, active: true},
            {id: 15, type: "auto", flow: "auto", category: "pago_cbu", label: "Medios de pago", question: "Datos para transferir / Formas de pago", response: "Nuestros medios de pago son:\n\n💵 Efectivo\n🏦 Transferencia bancaria\n📝 Cheques (a convenir)\n📱 E-cheq\n\n📋 Datos para transferencia bancaria:\n🏦 Banco: Credicoop\n👤 Titular: Loekemeyer S.A.\n🔢 CBU: {cbu}\n📝 CUIT: {cuit}\nAlias: {alias}\n\nUna vez hecha la transferencia, enviá el comprobante al sector de cobranzas:\n📲 WhatsApp 11 6557-4113", updated: true, active: true},
            {id: 17, type: "human", flow: "human", category: "urgencia_retiro", label: "Retiro urgente", question: "¿Puedo pasar hoy?", response: "Entiendo la urgencia. Voy a consultar con el depósito. Te confirmo a la brevedad.", updated: false, active: true},
            {id: 19, type: "auto", flow: "auto", category: "catalogo", label: "Catálogo", question: "¿Me pasás el catálogo?", response: "Claro! Podés ver todos los productos en nuestra web, explorar el catalogo y novedades con fotos...\n\n🔗 https://loekemeyer.com/", updated: true, active: true},
            {id: 20, type: "auto", flow: "auto", category: "comprobante", label: "Comprobante pago", question: "¿A dónde mando comprobante?", response: "📲 Enviá al sector de Cobranzas: WhatsApp 11 6557-4113", updated: false, active: true},
            {id: 21, type: "auto", flow: "auto", category: "minimo", label: "Mínimo de compra", question: "¿Mínimo de compra?", response: "Estimado cliente:\nLe comentamos que los pedidos que no llegan al monto mínimo de compra, que es de $500.000\nÚnicamente serán procesados si lo pasan a retirar, favor de confirmar en caso de que quieran que lo procesemos.\n\nLe recordamos que los pedidos se retirar por Virgilio 2788 en el horario de 13 a 16hs\n\nEn caso de que puedan retirarlo el mínimo es de $300.000\n\nSaludos cordiales,\nDepto. Ventas", updated: true, active: true},
            {id: 31, type: "auto", flow: "auto", category: "logistica", label: "Envíos", question: "¿Hacen envíos?", response: "🚚 ¡Hacemos envíos a todo el país!\n📍 CABA/GBA: entrega propia • Interior: expreso a cargo del cliente", updated: false, active: true},
            {id: 32, type: "semi", flow: "semi_vendor", category: "financiacion", label: "Financiación", question: "¿Tienen cuotas?", response: "💳 Formas: transferencia, cheques, contado, E-cheq. Para financiación, consultá vendedor. 📞", updated: false, active: false},
            {id: 33, type: "semi", flow: "semi_vendor", category: "vendedor", label: "Contacto vendedor", question: "Quiero hablar con vendedor", response: "Tu vendedor es {nombre}. Ya le avisé. Te va a contactar a la brevedad. 📱", updated: false, active: true},
            {id: 34, type: "semi", flow: "semi_product", category: "consulta_producto", label: "Consulta producto", question: "Consulta específica", response: "Tenemos estas opciones:\n{lista}\n¿Querés ver más o agregar al pedido?", updated: false, active: true},
            {id: 35, type: "human", flow: "human", category: "reclamo", label: "Faltante", question: "¿Hay faltante?", response: "Lamento el inconveniente. Indicame N° de pedido y qué falta. Un vendedor te contacta.", updated: false, active: true},
            {id: 36, type: "auto", flow: "auto", category: "marca", label: "Marca", question: "¿Tienen X marca?", response: "Sí, trabajamos con {marca}. ¿Querés ver opciones?", updated: false, active: true},
            {id: 37, type: "semi", flow: "semi_product", category: "presupuesto", label: "Presupuesto", question: "Necesito presupuesto", response: "Decime productos y cantidades y te armo el presupuesto.", updated: false, active: true},
            {id: 38, type: "auto", flow: "auto", category: "mercadopago", label: "Mercado Pago", question: "¿Aceptan Mercado Pago?", response: "[DESACTIVADO - Unificado en FAQ #15]", updated: false, active: false},
            {id: 39, type: "human", flow: "human", category: "cancelar", label: "Cancelar pedido", question: "Quiero cancelar", response: "Verifico el estado. Si está pendiente se puede cancelar. ¿N° de pedido?", updated: false, active: true},
            {id: 40, type: "auto", flow: "auto", category: "greeting_fallback", label: "Saludo/Bienvenida", question: "Hola / Necesito ayuda", response: "Hola! Te contactaste con Loekemeyer 👋\n¿En qué te puedo ayudar hoy?\n\n📦 Realizar un pedido\n📋 Consultar estado de pedido\n\nDecime qué necesitás y te asisto. 😊", updated: true, active: true}
        ];

        let statusFilter = 'all';
        let typeFilter = 'all';

        function filterFAQs(filterType, value) {
            if (filterType === 'status') {
                statusFilter = value;
                document.querySelectorAll('[data-filter-status]').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            } else if (filterType === 'type') {
                typeFilter = value;
                document.querySelectorAll('[data-filter-type]').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
            renderFAQs();
        }

        function renderFAQs() {
            const grid = document.getElementById('faqGrid');
            grid.innerHTML = '';

            faqs.forEach(faq => {
                const statusMatch = statusFilter === 'all' || (statusFilter === 'updated' && faq.updated);
                const typeMatch = typeFilter === 'all' || typeFilter === faq.type;

                if (statusMatch && typeMatch) {
                    const card = document.createElement('div');
                    card.className = `faq-card type-${faq.type} ${faq.updated ? 'updated' : ''} ${!faq.active ? 'hidden' : ''}`;

                    const typeLabel = {auto: '✅ AUTO', semi: '🔄 SEMI-AUTO', human: '👤 HUMANO'}[faq.type];
                    const flowText = flows[faq.flow];
                    const flowDetails = faq.flow === 'semi_order' ? '📊 Lookup: orders → order_status → fecha' :
                                       faq.flow === 'semi_customer' ? '📊 Lookup: customers → descuento, categoría' :
                                       faq.flow === 'semi_product' ? '📊 Lookup: products → precio, stock, código' :
                                       faq.flow === 'semi_vendor' ? '📊 Lookup: customer_vendors → contacto' : '';

                    card.innerHTML = `
                        <div class="faq-header">
                            <div>
                                <div class="faq-number">FAQ #${faq.id}</div>
                                ${faq.updated ? '<span class="faq-status-badge">✅ HOY</span>' : ''}
                                ${!faq.active ? '<span class="faq-status-badge inactive">INACTIVO</span>' : ''}
                            </div>
                        </div>

                        <div class="faq-category">${faq.category}</div>

                        <div class="faq-question">${faq.question}</div>

                        <div class="faq-response">${faq.response}</div>

                        <div class="faq-flow type-${faq.type}">
                            <span class="faq-flow-title">${typeLabel}</span>
                            ${flowText}
                            ${flowDetails ? `<div class="faq-flow-detail">${flowDetails}</div>` : ''}
                        </div>

                        <div class="faq-meta">
                            <span class="badge badge-${faq.type}">${typeLabel}</span>
                            <span>${faq.label}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        renderFAQs();
    </script>
</body>
</html>
