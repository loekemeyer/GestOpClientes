<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>GestOp — Bot WhatsApp Loekemeyer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f5; --card: #fff; --text: #1a1a1a; --muted: #666;
      --primary: #2563eb; --primary-hover: #1d4ed8; --border: #e5e7eb;
      --success: #16a34a; --warning: #f59e0b; --danger: #dc2626;
      --sidebar-bg: #1e293b; --sidebar-text: #e2e8f0;
      --wa-green: #25d366; --wa-bg: #efeae2; --wa-in: #fff; --wa-out: #d9fdd3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* Login */
    .login-overlay { position: fixed; inset: 0; background: var(--sidebar-bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: var(--card); border-radius: 12px; padding: 2rem; width: 320px; text-align: center; }
    .login-box h2 { margin-bottom: 0.5rem; }
    .login-box p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .login-box input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.95rem; }
    .login-box button { width: 100%; padding: 0.6rem; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    .login-box button:hover { background: var(--primary-hover); }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }

    /* Layout */
    .app { display: none; height: 100vh; }
    .app.active { display: flex; }
    .sidebar { width: 220px; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 1rem 0; display: flex; flex-direction: column; }
    .sidebar h3 { padding: 0 1rem; margin-bottom: 1rem; font-size: 1rem; }
    .sidebar a { display: block; padding: 0.6rem 1rem; color: var(--sidebar-text); text-decoration: none; font-size: 0.9rem; border-left: 3px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); border-left-color: var(--primary); }
    .sidebar .spacer { flex: 1; }
    .sidebar .user-info { padding: 0.6rem 1rem; font-size: 0.8rem; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.1); }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Chat */
    .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; }
    .chat-header { padding: 0.8rem 1.2rem; background: #075e54; color: #fff; display: flex; align-items: center; gap: 0.8rem; }
    .chat-header .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--wa-green); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .chat-header .info h2 { font-size: 1rem; font-weight: 600; }
    .chat-header .info span { font-size: 0.75rem; opacity: 0.8; }
    .chat-header .clear-btn { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .chat-header .clear-btn:hover { background: rgba(255,255,255,0.1); }

    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; background: var(--wa-bg); background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L35 15 L30 12 L25 15Z' fill='%23d4cfc4' opacity='0.3'/%3E%3C/svg%3E"); }
    .chat-messages .msg { max-width: 75%; padding: 0.5rem 0.7rem; margin-bottom: 0.4rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; position: relative; word-wrap: break-word; clear: both; }
    .chat-messages .msg.in { background: var(--wa-in); float: left; border-top-left-radius: 0; }
    .chat-messages .msg.out { background: var(--wa-out); float: right; border-top-right-radius: 0; }
    .chat-messages .msg .time { font-size: 0.65rem; color: var(--muted); float: right; margin: 4px 0 -4px 8px; }
    .chat-messages .msg.system { background: #fef3c7; float: none; max-width: 85%; margin: 0.5rem auto; text-align: center; font-size: 0.8rem; color: #92400e; border-radius: 6px; }
    .chat-messages::after { content: ""; display: table; clear: both; }
    .chat-messages .typing { float: left; background: var(--wa-in); border-top-left-radius: 0; padding: 0.6rem 1rem; }
    .chat-messages .typing span { display: inline-block; width: 8px; height: 8px; background: #999; border-radius: 50%; margin: 0 1px; animation: bounce 1.4s infinite; }
    .chat-messages .typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-messages .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

    .chat-input { display: flex; gap: 0.5rem; padding: 0.6rem; background: #f0f2f5; }
    .chat-input input { flex: 1; padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: 20px; font-size: 0.9rem; outline: none; }
    .chat-input input:focus { border-color: var(--primary); }
    .chat-input button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--wa-green); color: #fff; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .chat-input button:hover { background: #1da851; }
    .chat-input button:disabled { background: #ccc; cursor: default; }

    /* Cost panel (admin only) */
    .cost-panel { padding: 0.6rem 1rem; border-top: 1px solid rgba(255,255,255,0.1); display: none; }
    .cost-panel .cost-title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .cost-panel .cost-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; padding: 0.15rem 0; }
    .cost-panel .cost-label { color: #94a3b8; }
    .cost-panel .cost-val { color: #e2e8f0; font-family: 'SF Mono', 'Menlo', monospace; font-size: 0.7rem; }
    .cost-panel .cost-tok { color: #64748b; font-size: 0.6rem; font-family: 'SF Mono', 'Menlo', monospace; }
    .cost-panel .cost-divider { border-top: 1px solid rgba(255,255,255,0.05); margin: 0.3rem 0; }
  </style>
</head>
<body>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>GestOp</h2>
    <p>Bot WhatsApp — Loekemeyer</p>
    <input type="text" id="loginRole" placeholder="Usuario" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="off">
    <button onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <nav class="sidebar">
    <h3>🤖 GestOp</h3>
    <a href="#" class="active">💬 Chat Bot</a>
    <div class="spacer"></div>
    <div class="cost-panel" id="costPanel">
      <div class="cost-title">💰 Costos IA</div>
      <div class="cost-row"><span class="cost-label">Sesión</span><span class="cost-val" id="costSession">—</span></div>
      <div class="cost-row"><span></span><span class="cost-tok" id="costSessionTok"></span></div>
      <div class="cost-divider"></div>
      <div class="cost-row"><span class="cost-label">Semana</span><span class="cost-val" id="costWeek">—</span></div>
      <div class="cost-row"><span></span><span class="cost-tok" id="costWeekTok"></span></div>
      <div class="cost-divider"></div>
      <div class="cost-row"><span class="cost-label">Mes</span><span class="cost-val" id="costMonth">—</span></div>
      <div class="cost-row"><span></span><span class="cost-tok" id="costMonthTok"></span></div>
    </div>
    <div class="user-info">
      <span id="userRole"></span><br>
      <a href="#" onclick="doLogout()" style="color:#94a3b8;font-size:0.8rem;">Cerrar sesión</a>
    </div>
  </nav>

  <div class="main">
    <div class="chat-container">
      <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="info">
          <h2>Bot Loekemeyer</h2>
          <span id="chatStatus">En línea</span>
        </div>
        <button class="clear-btn" onclick="resetSession()">🔄 Nueva sesión</button>
        <button class="clear-btn" onclick="clearChat()">🗑 Limpiar</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Escribí un mensaje..." autocomplete="off">
        <button id="chatSend" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://kwkclwhmoygunqmlegrg.supabase.co";
const SB_KEY = "sb_publishable_mVX5MnjwM770cNjgiL6yLw_LDNl9pML";

const sb = window.supabase.createClient(SB_URL, SB_KEY);

let currentRole = null;
let sessionStart = null;
let testPhone = "54911" + Math.floor(10000000 + Math.random() * 90000000); // Teléfono random por sesión

// --- Auth ---
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function doLogin() {
  const role = document.getElementById("loginRole").value;
  const pass = document.getElementById("loginPass").value;
  const hash = await sha256(pass);
  const { data, error } = await sb
    .from("gestop_users")
    .select("role")
    .eq("username", role)
    .eq("password_hash", hash)
    .maybeSingle();
  if (data) {
    currentRole = data.role;
    sessionStorage.setItem("gestop_user", role);
    sessionStorage.setItem("gestop_role", data.role);
    sessionStorage.setItem("gestop_hash", hash);
    showApp();
  } else {
    document.getElementById("loginError").textContent = "Usuario o contraseña incorrecta";
  }
}

function doLogout() {
  sessionStorage.removeItem("gestop_user");
  sessionStorage.removeItem("gestop_role");
  sessionStorage.removeItem("gestop_hash");
  currentRole = null;
  document.getElementById("app").classList.remove("active");
  document.getElementById("loginOverlay").style.display = "flex";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginError").textContent = "";
}

function showApp() {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("app").classList.add("active");
  document.getElementById("userRole").textContent = currentRole === "admin" ? "🔑 Admin" : "👤 Vendedor";
  addSystemMsg("Escribí como si fueras un cliente de WhatsApp.");
  // Admin cost panel
  if (currentRole === "admin") {
    sessionStart = new Date().toISOString();
    document.getElementById("costPanel").style.display = "block";
    refreshCosts();
  }
  // Greeting from real bot
  botGreet();
}

// Auto-login
(async function() {
  const savedUser = sessionStorage.getItem("gestop_user");
  const hash = sessionStorage.getItem("gestop_hash");
  if (savedUser && hash) {
    const { data } = await sb.from("gestop_users").select("role").eq("username", savedUser).eq("password_hash", hash).maybeSingle();
    if (data) { currentRole = data.role; showApp(); }
    else { sessionStorage.removeItem("gestop_user"); sessionStorage.removeItem("gestop_role"); sessionStorage.removeItem("gestop_hash"); }
  }
})();

// Enter key login
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// --- Chat ---
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const chatSend = document.getElementById("chatSend");

function now() {
  return new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = text.replace(/\n/g, "<br>") + `<span class="time">${now()}</span>`;
  chatMessages.appendChild(div);
  // Clear float
  const clear = document.createElement("div");
  clear.style.clear = "both";
  chatMessages.appendChild(clear);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addBotMsg(text) { addMsg(text, "in"); }
function addUserMsg(text) { addMsg(text, "out"); }
function addSystemMsg(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  chatMessages.appendChild(div);
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg typing";
  div.id = "typingIndicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  chatMessages.appendChild(div);
  const clear = document.createElement("div");
  clear.style.clear = "both";
  clear.id = "typingClear";
  chatMessages.appendChild(clear);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideTyping() {
  document.getElementById("typingIndicator")?.remove();
  document.getElementById("typingClear")?.remove();
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  addUserMsg(text);
  chatInput.value = "";
  chatSend.disabled = true;
  showTyping();

  try {
    const { data, error } = await sb.functions.invoke("lk_chat-test", {
      body: { phone: testPhone, text },
    });

    hideTyping();

    if (error) {
      addBotMsg("❌ Error al conectar con el bot: " + (error.message || "desconocido"));
    } else {
      addBotMsg(data.reply || "Sin respuesta");
      if (data.customer) document.getElementById("chatStatus").textContent = "Conectado — " + data.customer;
    }
  } catch (err) {
    hideTyping();
    addBotMsg("❌ Error de conexión: " + err.message);
  }

  chatSend.disabled = false;
  chatInput.focus();
  if (currentRole === "admin") refreshCosts();
}

chatInput.addEventListener("keydown", e => { if (e.key === "Enter" && !chatSend.disabled) sendMessage(); });

function clearChat() {
  chatMessages.innerHTML = "";
  addSystemMsg("Chat limpiado. Escribí como si fueras un cliente.");
  botGreet();
}

function resetSession() {
  testPhone = "54911" + Math.floor(10000000 + Math.random() * 90000000);
  chatMessages.innerHTML = "";
  document.getElementById("chatStatus").textContent = "En línea";
  addSystemMsg("Nueva sesión iniciada — cliente no vinculado.");
  botGreet();
}

async function botGreet() {
  showTyping();
  try {
    const { data, error } = await sb.functions.invoke("lk_chat-test", {
      body: { phone: testPhone, text: "hola" },
    });
    hideTyping();
    if (error) {
      addBotMsg("¡Hola! Soy el asistente de Loekemeyer. ¿En qué te puedo ayudar?\n\n📦 Estado de tus pedidos\n🛒 Hacer un pedido nuevo\n🚚 Saber si podés pasar a retirar\n💬 Cualquier otra consulta");
    } else {
      addBotMsg(data.reply || "¡Hola! ¿En qué puedo ayudarte?");
      if (data.customer) document.getElementById("chatStatus").textContent = "Conectado — " + data.customer;
    }
  } catch {
    hideTyping();
    addBotMsg("¡Hola! Soy el asistente de Loekemeyer. ¿En qué te puedo ayudar?\n\n📦 Estado de tus pedidos\n🛒 Hacer un pedido nuevo\n🚚 Saber si podés pasar a retirar\n💬 Cualquier otra consulta");
  }
  if (currentRole === "admin") refreshCosts();
}

// --- Costs (admin only) ---
function fmtCost(v) {
  if (v == null || v === 0) return "$0.00";
  if (v < 0.01) return "$" + v.toFixed(4);
  return "$" + v.toFixed(2);
}

function fmtTok(inp, out) {
  const total = (inp || 0) + (out || 0);
  if (total === 0) return "";
  const fmt = total >= 1000 ? (total / 1000).toFixed(1) + "k" : total;
  return fmt + " tok (" + (inp || 0) + "→ " + (out || 0) + "←)";
}

async function refreshCosts() {
  if (currentRole !== "admin") return;
  try {
    const { data, error } = await sb.functions.invoke("lk_chat-test", {
      body: { action: "stats", since: sessionStart },
    });
    if (error || !data) return;
    document.getElementById("costSession").textContent = fmtCost(data.session?.cost);
    document.getElementById("costSessionTok").textContent = fmtTok(data.session?.input_tokens, data.session?.output_tokens);
    document.getElementById("costWeek").textContent = fmtCost(data.week?.cost);
    document.getElementById("costWeekTok").textContent = fmtTok(data.week?.input_tokens, data.week?.output_tokens);
    document.getElementById("costMonth").textContent = fmtCost(data.month?.cost);
    document.getElementById("costMonthTok").textContent = fmtTok(data.month?.input_tokens, data.month?.output_tokens);
  } catch (e) { /* silent */ }
}
</script>
<div style="position:fixed;bottom:8px;right:12px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:0.7rem;z-index:9999;pointer-events:none;">v0.2.2</div>
</body>
</html>
